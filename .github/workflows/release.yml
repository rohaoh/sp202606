name: Release

# 태그를 v1.0.0 형태로 push하면 자동으로 실행됩니다.
# (Actions 탭에서 "Run workflow" 버튼으로 수동 실행도 가능)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

# 이 프로젝트는 codes/<날짜폴더>/ 안에 있습니다.
# 새 날짜 폴더로 넘어갈 때마다 아래 PROJECT_DIR 값을 최신 폴더로 바꿔주세요.
env:
  PROJECT_DIR: codes/2026-7-6(9)

# GitHub Releases에 파일을 업로드하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

jobs:
  # x64 / arm64 두 아키텍처를 순차적으로 빌드해 같은 GitHub Release에 자산을 올린다.
  # 제작자(publisher) 이름을 아키텍처별로 다르게 넣어야 해서(x64=오로하, arm64=서예준),
  # electron-builder를 아키텍처마다 따로 호출하며 그 직전에 package.json의 author를 바꾼다.
  # max-parallel: 1로 순차 실행해 같은 release에 동시에 쓰다가 충돌하는 것을 방지한다.
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x64
            author: 오로하
          - arch: arm64
            author: 서예준

    defaults:
      run:
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: MSVC 빌드 도구 설정 (x64 호스트 → ${{ matrix.arch }} 타겟, 필요 시 크로스 컴파일)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: 이 아키텍처 전용 제작자(publisher) 이름 설정
        shell: pwsh
        run: npm pkg set author="${{ matrix.author }}"

      - name: C++ 물리 엔진 컴파일 (${{ matrix.arch }})
        run: npx cmake-js compile --arch=${{ matrix.arch }}

      - name: 번들링 (renderer.bundle.js 생성)
        run: npm run bundle

      - name: exe/msi 생성 + GitHub Release에 자산 업로드 (draft 유지)
        # 두 아키텍처 모두 자산 업로드가 끝난 뒤 finalize 잡에서 한 번만 발행(draft 해제)한다.
        run: npx electron-builder --win --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # x64/arm64 자산이 모두 올라간 뒤, 릴리즈 노트를 채우고 draft를 해제해 정식 발행한다.
  finalize:
    needs: build
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 버전 읽기
        id: pkgver
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: 릴리즈 노트 자동 반영 + 발행 (draft 해제)
        shell: pwsh
        run: |
          gh release edit "v${{ steps.pkgver.outputs.version }}" `
            --title "Physics Simulator v${{ steps.pkgver.outputs.version }}" `
            --notes-file "RELEASE_NOTES_LATEST.md" `
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
