name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  # ── 아키텍처별 빌드 (x64 / arm64) ─────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # MSVC 크로스 컴파일러 설정 (arm64 는 amd64_arm64 toolchain)
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}

      - name: Install CMake
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        shell: cmd

      - name: Install dependencies
        run: npm ci
        working-directory: codes/2026-7-7(1)
        env:
          HUSKY: '0'

      # cmake-js 로 C++ 물리 모듈 크로스 컴파일
      - name: Build native addon (${{ matrix.arch }})
        run: npx cmake-js compile --arch ${{ matrix.arch }}
        working-directory: codes/2026-7-7(1)
        env:
          npm_config_arch: ${{ matrix.arch }}

      # renderer.js → renderer.bundle.js (esbuild 번들링)
      - name: Bundle renderer
        run: node scripts/bundle.js
        working-directory: codes/2026-7-7(1)

      # electron-builder: NSIS(.exe) + MSI(.msi) 모두 빌드
      - name: Build installer (${{ matrix.arch }})
        run: npx electron-builder --win nsis msi --${{ matrix.arch }} --publish never
        working-directory: codes/2026-7-7(1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 빌드 결과물(.exe, .msi)을 아티팩트로 임시 저장
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            codes/2026-7-7(1)/dist/*.exe
            codes/2026-7-7(1)/dist/*.msi
          retention-days: 1

  # ── Draft 릴리즈 생성 + 아티팩트 첸부 ──────────────────────────
  release:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-x64
          path: dist

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-arm64
          path: dist

      - name: List dist files
        run: ls -lh dist/

      - name: Create Draft Release & upload files
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Physics Simulator ${{ github.ref_name }}
          body: |
            ## Physics Simulator ${{ github.ref_name }}

            ### 다운로드
            | 파일 | 아키텍처 | 형식 |
            |------|----------|────|
            | `*-x64.exe` | Intel / AMD 64-bit | NSIS 설치 마법사 |
            | `*-x64.msi` | Intel / AMD 64-bit | Windows Installer |
            | `*-arm64.exe` | ARM64 (Surface Pro X 등) | NSIS 설치 마법사 |
            | `*-arm64.msi` | ARM64 | Windows Installer |

            ### 설치 방법
            - **.exe**: 더블클릭 → 설치 마법사 진행
            - **.msi**: 더블클릭 → 자동 설치 (기업 배포용)
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
